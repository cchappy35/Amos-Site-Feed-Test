<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Morgan Amos — Listings &amp; Reviews</title>
<meta name="description" content="Active, pending, and closed listings plus client reviews for Morgan Amos, Kennon &amp; Parker, Columbus GA." />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #f7f4ef; color: #1d1a16; font-family: 'Work Sans', system-ui, sans-serif; padding: 52px 48px 80px; }
  a { color: #1d1a16; text-decoration: none; }
  a:hover { color: oklch(0.52 0.11 42); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.3; transform:scale(.75); } }
  @keyframes fadeup { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  header { display:flex; align-items:flex-end; justify-content:space-between; gap:40px; flex-wrap:wrap; }
  .eyebrow { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#8b8074; }
  h1 { margin:6px 0 0; font-family:'Instrument Serif',Georgia,serif; font-size:58px; line-height:1; font-weight:400; letter-spacing:-.015em; }
  .status { display:flex; align-items:center; gap:20px; }
  .live { display:flex; align-items:center; gap:9px; font-size:11.5px; color:#6f6862; }
  .dot { width:8px; height:8px; border-radius:50%; background:oklch(.72 .15 68); animation:pulse 2.4s ease-in-out infinite; }
  .dot.ok { background:oklch(.6 .13 145); }
  .dot.bad { background:oklch(.58 .17 25); }
  button.refresh { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    padding:10px 16px; border:1px solid #cdc4b7; border-radius:999px; background:transparent; color:#1d1a16;
    cursor:pointer; transition:background .15s,color .15s; }
  button.refresh:hover { background:#1d1a16; border-color:#1d1a16; color:#f7f4ef; }

  nav { display:flex; gap:4px; margin-top:34px; border-bottom:1px solid #ddd6cb; flex-wrap:wrap; }
  nav button { display:flex; align-items:baseline; gap:8px; background:transparent; border:0;
    border-bottom:2px solid transparent; padding:12px 18px 14px; margin-bottom:-1px; cursor:pointer;
    font-family:'Work Sans',sans-serif; font-size:15px; font-weight:500; color:#8b8074; transition:color .15s; }
  nav button[aria-selected="true"] { color:#1d1a16; border-bottom-color:#1d1a16; }
  nav button .n { font-family:'JetBrains Mono',monospace; font-size:11px; color:#a09689; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:46px 34px; margin-top:46px; }
  .card { display:flex; flex-direction:column; gap:15px; animation:fadeup .45s ease both; }
  .shot { position:relative; aspect-ratio:3/2; overflow:hidden; border-radius:3px;
    background:repeating-linear-gradient(135deg,#e8e1d6 0 10px,#eee8de 10px 20px); }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .6s cubic-bezier(.2,.7,.2,1); }
  .card:hover .shot img { transform:scale(1.035); }
  .badge { position:absolute; left:12px; top:12px; font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; padding:6px 10px; border-radius:2px; }
  .price { font-family:'Instrument Serif',Georgia,serif; font-size:32px; line-height:1; letter-spacing:-.01em; }
  .street { margin:2px 0 0; font-size:16.5px; font-weight:500; line-height:1.3; }
  .locality { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:#8b8074; }
  .when { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#a09689; }

  .reviews { margin-top:46px; columns:3 300px; column-gap:30px; }
  figure { break-inside:avoid; margin:0 0 30px; padding:26px; background:#fffdfa; border:1px solid #e6ded2; border-radius:4px; display:flow-root; }
  .stars { display:block; font-size:13px; letter-spacing:.22em; color:oklch(.68 .14 72); }
  blockquote { margin:14px 0 0; font-size:14.5px; line-height:1.62; color:#45403a; text-wrap:pretty; }
  figcaption { margin-top:16px; display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    border-top:1px solid #eee7dc; padding-top:12px; }
  figcaption .who { font-family:'Instrument Serif',Georgia,serif; font-size:19px; }
  figcaption .date { font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#a09689; }

  .empty { margin-top:70px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:#8b8074; }
  footer { margin-top:70px; border-top:1px solid #ddd6cb; padding-top:18px; display:flex; justify-content:space-between;
    gap:24px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#9a9086; flex-wrap:wrap; }
  @media (max-width:640px) { body { padding:36px 20px 60px; } h1 { font-size:42px; } }
</style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow mono">Kennon &amp; Parker · Columbus GA</div>
    <h1>Morgan Amos</h1>
  </div>
  <div class="status">
    <div class="live"><span class="dot" id="dot"></span><span class="mono" id="statusText">connecting…</span></div>
    <button class="refresh" id="refresh">Refresh</button>
  </div>
</header>

<nav id="tabs"></nav>
<div id="content"></div>

<footer>
  <span>Live from kpdd.com/agents/morganamos</span>
  <span>Auto-refresh · every 10 min</span>
</footer>

<script>
// kpdd.com sends Access-Control-Allow-Origin, so these are fetched directly in the
// browser. No proxy, no server function, nothing to deploy but this file.
const BASE = 'https://kpdd.com/agents/morganamos/';
const FEEDS = [
  { key:'active',  file:'active.rss',  label:'Active',  badge:'For sale',       bg:'rgba(247,244,239,.94)', fg:'#3b352d', empty:'No active listings right now.' },
  { key:'pending', file:'pending.rss', label:'Pending', badge:'Under contract', bg:'oklch(.68 .14 72)',     fg:'#231a08', empty:'Nothing under contract right now.' },
  { key:'closed',  file:'closed.rss',  label:'Closed',  badge:'Sold',           bg:'oklch(.46 .09 152)',    fg:'#f2f7f2', empty:'No closed sales listed yet.' },
  { key:'reviews', file:'reviews.rss', label:'Reviews', badge:'',               bg:'',                      fg:'',        empty:'No reviews yet.' }
];

const data = {};
const failed = new Set();
let tab = 'active';
let loaded = false;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parse(text) {
  if (!/^\s*(<\?xml|<rss)/i.test(text)) return null;
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) return null;
  const pick = (el, tag) => { const n = el.getElementsByTagName(tag)[0]; return n ? n.textContent.trim() : ''; };
  return [...doc.getElementsByTagName('item')].map(el => {
    const enc = el.getElementsByTagName('enclosure')[0];
    return {
      title: pick(el, 'title'),
      link: pick(el, 'link') || '#',
      date: pick(el, 'pubDate'),
      image: enc ? (enc.getAttribute('url') || '') : '',
      author: pick(el, 'dc:creator'),
      text: pick(el, 'description')
    };
  });
}

const parseDate = s => { const d = new Date(s); return isNaN(d) ? null : d; };
const fmt = d => d ? d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '';
function ago(d) {
  if (!d) return '';
  const days = Math.round((Date.now() - d.getTime()) / 86400000);
  if (days <= 0) return 'Listed today';
  if (days === 1) return 'Listed yesterday';
  if (days < 45) return 'Listed ' + days + ' days ago';
  return 'Listed ' + fmt(d);
}

function renderTabs() {
  $('#tabs').innerHTML = FEEDS.map(f =>
    '<button role="tab" aria-selected="' + (f.key === tab) + '" data-key="' + f.key + '">' +
    f.label + '<span class="n">' + ((data[f.key] || []).length) + '</span></button>'
  ).join('');
  $('#tabs').querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => { tab = b.dataset.key; renderTabs(); renderBody(); }));
}

function renderBody() {
  const f = FEEDS.find(x => x.key === tab);
  const rows = data[tab] || [];

  if (!rows.length) {
    $('#content').innerHTML = loaded
      ? '<div class="empty">' + (failed.has(tab) ? 'This feed could not be reached.' : esc(f.empty)) + '</div>'
      : '';
    return;
  }

  if (tab === 'reviews') {
    $('#content').innerHTML = '<div class="reviews">' + rows.map(r => {
      const stars = (r.title.match(/★/g) || []).length || 5;
      const who = r.author || r.title.replace(/^[★\s]*review from\s*/i, '');
      let body = (r.text || '').replace(/\s*\n+\s*/g, ' ').trim();
      if (body.length > 460) body = body.slice(0, 460).replace(/\s+\S*$/, '') + '…';
      return '<figure><span class="stars">' + '★'.repeat(stars) + '</span>' +
        '<blockquote>' + esc(body) + '</blockquote>' +
        '<figcaption><span class="who">' + esc(who) + '</span>' +
        '<span class="date">' + fmt(parseDate(r.date)) + '</span></figcaption></figure>';
    }).join('') + '</div>';
    return;
  }

  $('#content').innerHTML = '<div class="grid">' + rows.map(r => {
    const d = parseDate(r.date);
    const price = (r.title.match(/\$[\d,]+/) || [''])[0] || 'Price on request';
    const addr = r.title.replace(/\s*[—–-]\s*\$[\d,]+\s*$/, '').trim();
    const parts = addr.split(',');
    const when = tab === 'closed' ? 'Closed ' + fmt(d) : tab === 'pending' ? 'Went pending ' + fmt(d) : ago(d);
    return '<a class="card" href="' + esc(r.link) + '" target="_blank" rel="noopener">' +
      '<div class="shot">' +
        (r.image ? '<img src="' + esc(r.image) + '" alt="" loading="lazy">' : '') +
        '<span class="badge" style="background:' + f.bg + ';color:' + f.fg + '">' + esc(f.badge) + '</span>' +
      '</div><div>' +
        '<div class="price">' + esc(price) + '</div>' +
        '<h2 class="street">' + esc(parts[0].trim()) + '</h2>' +
        '<div class="locality">' + esc(parts.slice(1).join(',').replace(/\s+/g,' ').trim()) + '</div>' +
      '</div><div class="when">' + esc(when) + '</div></a>';
  }).join('') + '</div>';
}

function renderStatus() {
  const dot = $('#dot');
  if (!loaded) { dot.className = 'dot'; $('#statusText').textContent = 'connecting…'; return; }
  const n = failed.size;
  dot.className = 'dot' + (n === 0 ? ' ok' : n === FEEDS.length ? ' bad' : '');
  $('#statusText').textContent = n === 0 ? 'live · updated just now'
    : n === FEEDS.length ? 'feeds unreachable'
    : 'live · ' + n + ' feed' + (n > 1 ? 's' : '') + ' unreachable';
}

async function loadAll() {
  failed.clear();
  await Promise.all(FEEDS.map(async f => {
    try {
      const res = await fetch(BASE + f.file, { cache: 'no-store' });
      if (!res.ok) { failed.add(f.key); return; }
      const items = parse(await res.text());
      if (items === null) { failed.add(f.key); return; }
      // Newest first; feeds are usually ordered already, but don't rely on it.
      data[f.key] = items.sort((a, b) => {
        const x = parseDate(b.date), y = parseDate(a.date);
        return (x ? x.getTime() : 0) - (y ? y.getTime() : 0);
      });
    } catch (e) { failed.add(f.key); }
  }));
  loaded = true;
  renderTabs(); renderBody(); renderStatus();
}

$('#refresh').addEventListener('click', loadAll);
renderTabs();
loadAll();
setInterval(loadAll, 10 * 60 * 1000);
</script>
</body>
</html>
